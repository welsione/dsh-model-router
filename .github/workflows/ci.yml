name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: node --check lib/index.js && node --check lib/client.js && node --check lib/core.mjs
      - name: Unit tests (cross-platform; zero-dependency node:test)
        shell: bash
        run: npm test
      - name: Package smoke (dry-run)
        shell: bash
        run: npm pack --dry-run
